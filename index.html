<title>Soal Latihan Kelas 1 – Prestasi Global</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#1d2b4f;--mut:#5b6785;--pr:#2b5fd9;--ok:#1f9d55;--no:#d64545;--bd:#d5def2}
@media(prefers-color-scheme:dark){:root{--bg:#121826;--card:#1b2438;--tx:#e8eeff;--mut:#9fb0d6;--pr:#6c97ff;--ok:#4cd08a;--no:#ff7b7b;--bd:#32405f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .6em}
button,select,input{font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
input[type=text]{width:100%;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tab{flex:1;min-width:110px;padding:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font-weight:600}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.q{border-top:1px dashed var(--bd);padding:12px 0}.pic{font-size:2.4rem;line-height:1.2;margin:4px 0}.pic img{max-width:100%;max-height:120px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.pic svg{width:70px;height:70px}
label.o{display:block;padding:8px 10px;margin:5px 0;border:2px solid var(--bd);border-radius:10px;cursor:pointer}
label.o:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
select{width:100%;padding:9px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.bank span{background:color-mix(in srgb,var(--pr) 15%,transparent);border-radius:20px;padding:4px 12px;font-size:.9rem}
.match{display:grid;grid-template-columns:1fr;gap:4px}
details img.sum{width:100%;border-radius:8px;border:1px solid var(--bd);margin-top:8px;background:#fff}
.score{font-size:3rem;font-weight:800;color:var(--pr);text-align:center}.hide{display:none}
.good{color:var(--ok);font-weight:700}.bad{color:var(--no);font-weight:700}
.key li{margin:4px 0}.apr{text-align:center;font-size:1.05rem}.apr .big{font-size:3rem}
</style></head><body><div class="wrap">

<div class="match">${d.M.map((m,j)=>`<div class="q"><b>${j+1}.</b><div class="pic">${m.p}</div><select id="m${i}_${j}"><option value="">— pilih jawaban —</option>${d.B.map(b=>`<option>${b}</option>`).join("")}</select></div>`).join("")}</div></div>

document.querySelectorAll("[data-fin]").forEach(b=>b.onclick=()=>fin(+b.dataset.fin))}
function fin(i){const d=D[i];let un=0;d.Q.forEach((q,j)=>{if(!document.querySelector(`input[name=q${i}_${j}]:checked`))un++});d.M.forEach((m,j)=>{if(!$(`m${i}_${j}`).value)un++});
const w=$("w"+i);if(un&&!d.warned){d.warned=1;w.textContent=`Masih ada ${un} soal belum dijawab. Tekan “Selesai” lagi jika ingin tetap melihat nilai.`;w.classList.remove("hide");return}
w.classList.add("hide");let ok=0;const key=[],mk=[];

d.M.forEach((m,j)=>{const r=$(`m${i}_${j}`).value===m.a;if(r)ok++;mk.push(`<li>${j+1}. <b>${m.a}</b> ${r?'<span class=good>✔</span>':'<span class=bad>✘</span>'}</li>`)});
const sc=Math.max(1,Math.round(ok*100/25)),t=sc>=90?["🏆","Luar biasa","Kamu hebat sekali! Pertahankan ya!"]:sc>=75?["🌟","Hebat","Kerja kerasmu terlihat. Sedikit lagi sempurna!"]:sc>=60?["👍","Bagus","Kamu sudah baik. Ayo belajar lagi biar lebih keren!"]:["💪","Semangat","Jangan menyerah. Baca rangkuman lagi, kamu pasti bisa!"];

<div class="apr"><div class="big">${t[0]}</div><h2>${t[1]}, ${NAME}!</h2><p>Selamat ${NAME}, kamu sudah menyelesaikan latihan <b>${d.n}</b>. ${t[2]}</p></div>
